{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PusikMusik{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
  <meta name="theme-color" content="#061824">
  <link rel="stylesheet" href="{% static 'authentication/css/neon.css' %}">

<!--
Splash screen (показываем 1 раз на вкладку + принудительно по ?splash=1)
ВАЖНО: на некоторых десктопных браузерах sessionStorage может вести себя нестабильно.
Поэтому используем гибрид: sessionStorage + window.name (тоже "на вкладку" и сбрасывается при закрытии).
-->

  <script>
    (function () {
      var params;
      try { params = new URLSearchParams(window.location.search); } catch(e) { params = null; }

      var force = false;
      try { force = params && params.get('splash') === '1'; } catch(e) {}

      var key = 'pm_splash_shown';

      function hasShown() {
        try {
          if (sessionStorage.getItem(key) === '1') return true;
        } catch (e) {}
        try {
          return (window.name || '').indexOf(key + '=1') !== -1;
        } catch (e) {
          return false;
        }
      }

      function markShown() {
        try { sessionStorage.setItem(key, '1'); } catch (e) {}
        try {
          if ((window.name || '').indexOf(key + '=1') === -1) {
            window.name = (window.name ? (window.name + ';') : '') + key + '=1';
          }
        } catch (e) {}
      }

      if (!hasShown() || force) {
        document.documentElement.classList.add('show-splash');
        markShown();

        // чтобы при F5/повторном открытии этой же страницы заставка не повторялась
        if (force && params) {
          try {
            params.delete('splash');
            var qs = params.toString();
            var newUrl = window.location.pathname + (qs ? ('?' + qs) : '') + window.location.hash;
            history.replaceState(null, '', newUrl);
          } catch (e) {}
        }
      }
    })();
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="splash-overlay" aria-hidden="true">
    <img class="splash-img" src="{% static 'img/splash-panda.png' %}" alt="">
  </div>

  <div class="starfield" aria-hidden="true">
    <div class="stars s1"></div>
    <div class="stars s2"></div>
    <div class="stars s3"></div>
  </div>
  <div class="nebula" aria-hidden="true"></div>

  <!-- Оверлей с гифкой (показывается по нажатию кнопки «Нажми») -->
  <div class="dance-overlay" id="danceOverlay" aria-hidden="true">
    <img class="dance-gif" src="{% static 'img/miku-dance.gif' %}" alt="">
  </div>

  <div class="page">
    {% block content %}{% endblock %}
  </div>

  <nav class="bottom-nav" aria-label="Навигация">
    <a class="nav-item {% if active_nav == 'search' %}active{% endif %}" href="{% url 'home' %}">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <div class="label">Поиск</div>
    </a>

    <a class="nav-item {% if active_nav == 'create' %}active{% endif %}" href="{% url 'create' %}">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <div class="label">Создать</div>
    </a>

    <a class="nav-item {% if active_nav == 'login' %}active{% endif %}" href="{% url 'auth' %}?tab=login">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 17l5-5-5-5"></path>
        <path d="M15 12H3"></path>
        <path d="M21 21V3a2 2 0 0 0-2-2H11a2 2 0 0 0-2 2"></path>
      </svg>
      <div class="label">Вход</div>
    </a>

    <a class="nav-item {% if active_nav == 'profile' %}active{% endif %}" href="{% url 'profile' %}">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21a8 8 0 0 0-16 0"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <div class="label">Профиль</div>
    </a>
  </nav>

  <script>
    (function () {
      var overlay = document.querySelector('.splash-overlay');
      if (!overlay) return;

      // если класс не поставили в <head>, значит заставка не нужна — удаляем
      if (!document.documentElement.classList.contains('show-splash')) {
        overlay.remove();
        return;
      }

      // держим 3 секунды, затем плавно скрываем
      window.setTimeout(function () {
        overlay.classList.add('is-hiding');
      }, 2600);

      window.setTimeout(function () {
        overlay.remove();
        document.documentElement.classList.remove('show-splash');
      }, 3100);
    })();
  </script>

  <script>
    // Кнопка «Нажми» (в центре нижней навигации) показывает гифку на весь экран.
    (function () {
      var danceOverlay = document.getElementById('danceOverlay');
      if (!danceOverlay) return;

      function showDance() {
        danceOverlay.classList.add('is-visible');
        danceOverlay.setAttribute('aria-hidden', 'false');
      }

      function hideDance() {
        danceOverlay.classList.remove('is-visible');
        danceOverlay.setAttribute('aria-hidden', 'true');
      }

      function toggleDance() {
        if (danceOverlay.classList.contains('is-visible')) hideDance();
        else showDance();
      }

      // Закрытие по клику на фон
      danceOverlay.addEventListener('click', function (e) {
        // если кликнули именно по фону (не по картинке)
        if (e.target === danceOverlay) hideDance();
      });

      // Закрытие по Esc
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hideDance();
      });

      // 1) Ищем уже существующую кнопку
      var trigger = document.querySelector('[data-dance-trigger="1"]');

      // 2) Если её нет — пытаемся найти по тексту «нажми»
      if (!trigger) {
        var candidates = document.querySelectorAll('.bottom-nav .nav-item');
        for (var i = 0; i < candidates.length; i++) {
          var t = (candidates[i].textContent || '').trim().toLowerCase();
          if (t.indexOf('нажми') !== -1) { trigger = candidates[i]; break; }
        }
      }

      // 3) Если всё равно нет — добавляем кнопку в центр (чтобы было 5 кнопок)
      if (!trigger) {
        var nav = document.querySelector('.bottom-nav');
        if (!nav) return;

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-item nav-press';
        btn.setAttribute('data-dance-trigger', '1');
        btn.innerHTML =
          '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
          + '<path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"></path>'
          + '</svg>'
          + '<div class="label">Нажми</div>';

        // вставляем после второй кнопки (центр)
        var items = nav.querySelectorAll('.nav-item');
        if (items.length >= 2 && items[1].nextSibling) {
          nav.insertBefore(btn, items[1].nextSibling);
        } else {
          nav.appendChild(btn);
        }

        trigger = btn;
      }

      // Если это ссылка — отменяем переход
      trigger.addEventListener('click', function (e) {
        if (trigger.tagName && trigger.tagName.toLowerCase() === 'a') {
          e.preventDefault();
        }
        toggleDance();
      });
    })();
  </script>
</body>
</html>
